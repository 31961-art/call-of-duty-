
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Card Warzone</title>

<style>
body {
    background: #171717;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px;
}

.card {
    width: 280px;
    height: 480px;
    background: #252525;
    border-radius: 12px;
    overflow: hidden;
    color: white;
    box-shadow: 0 4px 15px #000;
}

.card img {
    width: 100%;
    height: 55%;
    object-fit: cover;
}

.conteudo {
    height: 50%;
    padding: 15px;
    box-sizing: border-box;
}

h2 {
    color: #b5d334;
    margin-top: 5px;
}

p {
    color: #ccc;
    font-size: 14px;
    line-height: 1.5;
}

a {
    display: block;
    background: #a5c52a;
    color: black;
    text-align: center;     
    padding: 10px;
    text-decoration: none;
    border-radius: 5px;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <img src="./css/assets/img/images.jpg" alt="Call of Duty Warzone">

    <div class="conteudo">
        <h2>Call of Duty: Warzone</h2>

        <p>
            Entre no campo de batalha, enfrente
            seus inimigos e lute pela vitória
            neste incrível jogo de tiro.
        </p>

        <a href="https://www.callofduty.com/warzone"
           target="_blank">
            Saiba mais
        </a>
    </div>

</div>

</body>
</html>
